services:
  # 1. Dedicated Teacher Upload Studio (For instructor to upload and manage notes)
  - type: web
    name: course-teacher-studio
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORTAL_MODE
        value: teacher
      - key: VITE_PORTAL_MODE
        value: teacher
      - key: NODE_OPTIONS
        value: --max-old-space-size=350

  # 2. Dedicated Student Study Hub (For 16 students to study notes and take quizzes)
  - type: web
    name: course-student-hub
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORTAL_MODE
        value: student
      - key: VITE_PORTAL_MODE
        value: student
      - key: NODE_OPTIONS
        value: --max-old-space-size=350
