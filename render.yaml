services:
  - type: web
    name: course-teacher-portal
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORTAL_MODE
        value: teacher

  - type: web
    name: course-student-portal
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORTAL_MODE
        value: student
