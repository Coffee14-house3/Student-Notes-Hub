services:
  - type: web
    name: course-teacher-portal
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORTAL_MODE
        value: teacher
      - key: NODE_OPTIONS
        value: --max-old-space-size=350
