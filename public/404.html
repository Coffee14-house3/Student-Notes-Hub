<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Course Notes Hub</title>
  <script>
    // GitHub Pages Single Page App Redirect
    (function() {
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      
      // Check if user is navigating to teacher studio
      if (path.toLowerCase().indexOf('teacher') !== -1) {
        var newSearch = search ? search + '&portal=teacher' : '?portal=teacher';
        window.location.replace('./' + newSearch + hash);
      } else {
        // Default to student portal
        window.location.replace('./' + (search || '?portal=student') + hash);
      }
    })();
  </script>
</head>
<body style="background:#020617;color:#94a3b8;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <p>Loading Course Notes Hub...</p>
</body>
</html>
